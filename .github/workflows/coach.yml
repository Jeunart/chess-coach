name: coach
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch_games.py
      - run: |
          git config user.name "chess-coach-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seance.md
          git diff --cached --quiet || git commit -m "maj seance"
          git push
