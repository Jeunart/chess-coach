name: analyse
on:
  schedule:
    # Passages de nuit (UTC), tous après minuit à Zurich (la séance est datée du jour à Zurich).
    # GitHub retarde souvent les planifications de plusieurs heures, voire en saute : on multiplie
    # les créneaux pour que les données soient prêtes le matin. Sans changement, aucun commit ;
    # le groupe de concurrence évite les exécutions simultanées.
    - cron: "17 23 * * *"
    - cron: "47 0 * * *"
    - cron: "47 2 * * *"
    - cron: "47 4 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Date de la séance à régénérer (AAAA-MM-JJ), vide = aujourd'hui"
        required: false
      mode:
        description: "complet (défaut) ou diagnostic (compare les compteurs chess.com aux archives, ne modifie rien)"
        required: false
        default: "complet"
permissions:
  contents: write
concurrency:
  group: analyse
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update -q
          sudo apt-get install -y -q stockfish
          pip install chess
      - name: Diagnostic d'import
        if: github.event.inputs.mode == 'diagnostic'
        run: python -m coach.diagnostic
      - name: Import et analyse
        if: github.event.inputs.mode != 'diagnostic'
        run: python -m coach.analyse
      - name: Génération des fichiers
        if: github.event.inputs.mode != 'diagnostic'
        run: python -m coach.render ${{ github.event.inputs.date }}
      - name: Publication
        if: github.event.inputs.mode != 'diagnostic'
        run: |
          git config user.name "chess-coach-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/v2 seance.md corriges.md rapport.md bilan.md theorie.md rapport profil.md archives
          git diff --cached --quiet || git commit -m "maj séance"
          git pull --rebase -q
          git push
