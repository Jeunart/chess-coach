name: analyse
on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update -q
          sudo apt-get install -y -q stockfish
          pip install chess
      - run: python analyze_all.py
      - run: python resume.py
      - run: python digest.py
      - run: |
          git config user.name "chess-coach-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data seance.md seances
          git diff --cached --quiet || git commit -m "maj analyse"
          git pull --rebase -q
          git push
